<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerSage AI</title>
<style>:root{--bg:#0b1026;--cd:#151c3f;--cy:#22d3ee;--vi:#8b5cf6;--am:#fbbf24;--tx:#f1f5f9;--mu:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px}h1{margin:0;font-size:34px}h1 span{color:var(--cy)}p.s{color:var(--mu);margin:4px 0 20px}
nav{display:flex;gap:8px;margin-bottom:14px}nav button{flex:1;padding:10px;border:1px solid var(--vi);background:none;color:var(--tx);border-radius:10px;cursor:pointer}
nav button.on{background:var(--vi)}.card{background:var(--cd);border:1px solid var(--cy);border-radius:14px;padding:16px}
textarea,input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--mu);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.go{background:var(--am);color:var(--bg);font-weight:700;border:0;padding:10px 22px;border-radius:10px;cursor:pointer}
#out{white-space:pre-wrap;margin-top:14px;padding:14px;border-left:4px solid var(--cy);background:var(--bg);border-radius:8px;min-height:20px}</style>
<main><h1>Career<span>Sage</span> AI</h1><p class="s">Grounded, cited career guidance.</p>
<nav><button class="on" data-t="ask">Ask</button><button data-t="gap">Skill Gap</button><button data-t="rec">Role Match</button></nav>
<div class="card"><div id="ask"><input id="q" placeholder="e.g. How do I become an AI engineer?" maxlength="500"><button class="go" onclick="ask()">Ask</button></div>
<div id="gap" hidden><select id="role"></select><textarea id="r1" rows="6" placeholder="Paste your resume text"></textarea><button class="go" onclick="gap()">Analyze</button></div>
<div id="rec" hidden><textarea id="r2" rows="6" placeholder="Paste your resume text"></textarea><button class="go" onclick="rec()">Find roles</button></div>
<div id="out">Ask something to begin.</div></div></main>
<script>const $=s=>document.querySelector(s),out=t=>$('#out').textContent=t;
async function call(u,b){try{const r=await fetch(u,b&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}catch(e){out('Error: '+e.message)}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));['ask','gap','rec'].forEach(t=>$('#'+t).hidden=t!=b.dataset.t)});
call('/api/roles').then(j=>j&&($('#role').innerHTML=j.map(r=>`<option value="${r.id}">${r.title}</option>`).join('')));
async function ask(){out('Thinking...');const j=await call('/api/ask',{question:$('#q').value});j&&out(j.answer)}
async function gap(){out('Analyzing...');const j=await call('/api/gap',{resume:$('#r1').value,role:$('#role').value});
j&&out(`${j.title}: ${j.score}% match\n\nHave: ${j.matched.join(', ')||'-'}\nMissing: ${j.missing.join(', ')||'-'}\n\nRoadmap:\n`+j.roadmap.map((s,i)=>`${i+1}. ${s}`).join('\n')+'\n\nSources: '+j.sources.map(s=>`[${s}]`).join(' '))}
async function rec(){out('Matching...');const j=await call('/api/recommend',{resume:$('#r2').value});j&&out(j.roles.length?j.roles.map(r=>`${r.title} - ${r.score}% (${r.matched.join(', ')})`).join('\n'):'No known skills found.')}</script></html>
