<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="CareerSage AI: career answers you can verify" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="none" stroke="#1e293b"/>

  <!-- floating chips -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="40" y="28" width="230" height="38" rx="19" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="155" y="53" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="600">✓ 23/23 tests passing</text>

    <rect x="1010" y="28" width="230" height="38" rx="19" fill="#0b1220" stroke="#8b5cf6">
      <animate attributeName="stroke" values="#8b5cf6;#22d3ee;#8b5cf6" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="1125" y="53" text-anchor="middle" fill="#c4b5fd" font-family="'Courier New', monospace" font-size="15">[ml-engineer:roadmap]</text>
  </g>

  <!-- headline -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="640" y="112" fill="#67e8f9" font-size="16" letter-spacing="6">RAG-POWERED CAREER &amp; SKILL INTELLIGENCE AGENT</text>
    <text x="640" y="202" fill="url(#accent)" font-size="88" font-weight="800">CareerSage AI</text>
    <text x="640" y="252" fill="#f8fafc" font-size="30" font-weight="600">Career answers you can verify.</text>
    <text x="640" y="288" fill="#94a3b8" font-size="18">Every answer cited  ·  Out-of-scope questions refused  ·  Zero dependencies</text>
  </g>

  <!-- pipeline -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="18" text-anchor="middle">
    <path d="M85 358 H1195" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>

    <rect x="85" y="332" width="190" height="52" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="180" y="364" fill="#e2e8f0">Normalize</text>

    <rect x="315" y="332" width="190" height="52" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="410" y="364" fill="#e2e8f0">Scope guard</text>

    <rect x="545" y="332" width="190" height="52" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="640" y="364" fill="#e2e8f0">BM25 search</text>

    <rect x="775" y="332" width="190" height="52" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="870" y="364" fill="#e2e8f0">Intent boost</text>

    <rect x="1005" y="332" width="190" height="52" rx="14" fill="url(#accent)"/>
    <text x="1100" y="364" fill="#050b18" font-weight="700">Cited answer</text>

    <circle r="7" fill="#22d3ee">
      <animateMotion dur="5s" repeatCount="indefinite" path="M85 358 H1195"/>
    </circle>
  </g>

  <rect x="60" y="404" width="1160" height="4" rx="2" fill="url(#accent)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
