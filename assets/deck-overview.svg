<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="60" y="70" fill="#67e8f9" font-family="Arial" font-size="22" letter-spacing="6">ANYALSTRUSHI / AI ENGINEERING</text><text x="60" y="124" fill="#f8fafc" font-family="Arial" font-size="44" font-weight="700">CareerSage AI — Project Deck</text><text x="60" y="160" fill="#94a3b8" font-family="Arial" font-size="20">Career intelligence. Grounded in evidence.</text><g font-family="Arial"><rect x="60" y="200" width="580" height="400" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="88" y="242" fill="#67e8f9" font-size="18">01 / COVER</text><text x="88" y="290" fill="#f8fafc" font-size="38" font-weight="700">CareerSage AI</text><text x="88" y="328" fill="#cbd5e1" font-size="20">Retrieval-first career intelligence API</text><text x="88" y="364" fill="#94a3b8" font-size="17">Cited answers / Skill gaps / Role recommendations</text><rect x="88" y="400" width="200" height="36" rx="18" fill="#0f172a" stroke="#334155"/><text x="104" y="424" fill="#67e8f9" font-size="15">PYTHON / RAG / API</text><rect x="88" y="448" width="200" height="36" rx="18" fill="#0f172a" stroke="#334155"/><text x="104" y="472" fill="#8b5cf6" font-size="15">DOCKER / TESTS</text><rect x="88" y="508" width="504" height="60" rx="12" fill="#111827"/><text x="112" y="544" fill="#f8fafc" font-size="17">Zero-dependency core / Optional LLM mode</text><rect x="660" y="200" width="580" height="400" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="688" y="242" fill="#67e8f9" font-size="18">02 / PROBLEM</text><text x="688" y="290" fill="#f8fafc" font-size="32" font-weight="700">Career advice needs evidence</text><text x="688" y="328" fill="#cbd5e1" font-size="18">Generic chatbots can produce confident but unverifiable answers.</text><rect x="688" y="364" width="524" height="60" rx="12" fill="#111827"/><text x="712" y="400" fill="#f8fafc" font-size="17">Traditional chatbot → uncertain source</text><rect x="688" y="436" width="524" height="60" rx="12" fill="#111827"/><text x="712" y="472" fill="#67e8f9" font-size="17">CareerSage → retrieved context + citation</text><rect x="688" y="508" width="524" height="60" rx="12" fill="#111827"/><text x="712" y="544" fill="#94a3b8" font-size="17">Scope guard refuses unrelated questions</text><rect x="1260" y="200" width="580" height="400" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="1288" y="242" fill="#67e8f9" font-size="18">03 / SOLUTION</text><text x="1288" y="290" fill="#f8fafc" font-size="32" font-weight="700">Retrieve first, then answer</text><text x="1288" y="328" fill="#cbd5e1" font-size="18">Normalize, guard, retrieve, explain.</text><rect x="1288" y="364" width="524" height="60" rx="12" fill="#111827"/><text x="1312" y="400" fill="#67e8f9" font-size="17">Question → Normalize → Guard → Retrieve → Cite</text><rect x="1288" y="436" width="524" height="60" rx="12" fill="#111827"/><text x="1312" y="472" fill="#f8fafc" font-size="17">BM25 retrieval + intent boosting</text><rect x="1288" y="508" width="524" height="60" rx="12" fill="#111827"/><text x="1312" y="544" fill="#94a3b8" font-size="17">Optional LLM or extractive fallback</text><rect x="60" y="620" width="580" height="400" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="88" y="662" fill="#67e8f9" font-size="18">04 / FEATURES</text><text x="88" y="710" fill="#f8fafc" font-size="32" font-weight="700">What it delivers</text><text x="88" y="748" fill="#cbd5e1" font-size="18">• Career Q&A with inline citations</text><text x="88" y="776" fill="#cbd5e1" font-size="18">• Resume skill-gap analysis</text><text x="88" y="804" fill="#cbd5e1" font-size="18">• Role recommendations</text><text x="88" y="832" fill="#cbd5e1" font-size="18">• Out-of-scope refusal</text><text x="88" y="860" fill="#cbd5e1" font-size="18">• Alias and typo tolerance</text><rect x="660" y="620" width="580" height="400" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="688" y="662" fill="#67e8f9" font-size="18">05 / ARCHITECTURE</text><text x="688" y="710" fill="#f8fafc" font-size="32" font-weight="700">System flow</text><rect x="688" y="740" width="524" height="48" rx="10" fill="#111827"/><text x="712" y="770" fill="#f8fafc" font-size="17">Validation + rate limiting</text><rect x="688" y="800" width="524" height="48" rx="10" fill="#111827"/><text x="712" y="830" fill="#f8fafc" font-size="17">Normalization + scope guard</text><rect x="688" y="860" width="524" height="48" rx="10" fill="#111827"/><text x="712" y="890" fill="#67e8f9" font-size="17">Retrieval → cited answer</text><rect x="1260" y="620" width="580" height="400" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="1288" y="662" fill="#67e8f9" font-size="18">06 / RUN + DEPLOY</text><text x="1288" y="710" fill="#f8fafc" font-size="32" font-weight="700">Run, validate, extend</text><rect x="1288" y="740" width="524" height="48" rx="10" fill="#111827"/><text x="1312" y="770" fill="#67e8f9" font-size="16">python -m app.server</text><rect x="1288" y="800" width="524" height="48" rx="10" fill="#111827"/><text x="1312" y="830" fill="#67e8f9" font-size="16">python -m unittest discover -v</text><rect x="1288" y="860" width="524" height="48" rx="10" fill="#111827"/><text x="1312" y="890" fill="#67e8f9" font-size="16">docker build -t careersage-ai .</text></g><rect x="60" y="1044" width="1800" height="4" rx="2" fill="url(#accent)"/></svg>