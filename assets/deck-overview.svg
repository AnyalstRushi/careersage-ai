<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="72" fill="#67e8f9" font-family="Arial" font-size="22" letter-spacing="6">ANYALSTRUSHI / AI ENGINEERING</text><text x="60" y="128" fill="#f8fafc" font-family="Arial" font-size="46" font-weight="700">CareerSage AI — Project Deck</text><text x="60" y="166" fill="#94a3b8" font-family="Arial" font-size="22">Career intelligence. Grounded in evidence.</text><g font-family="Arial"><rect x="60" y="210" width="480" height="310" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="88" y="252" fill="#67e8f9" font-size="18">01 / COVER</text><text x="88" y="296" fill="#f8fafc" font-size="34" font-weight="700">CareerSage AI</text><text x="88" y="334" fill="#cbd5e1" font-size="19">Retrieval-first career intelligence API</text><text x="88" y="368" fill="#94a3b8" font-size="17">Cited answers / Skill gaps / Role recommendations</text><rect x="88" y="404" width="180" height="34" rx="17" fill="#0f172a" stroke="#334155"/><text x="104" y="427" fill="#67e8f9" font-size="15">PYTHON / RAG / API</text><rect x="88" y="452" width="180" height="34" rx="17" fill="#0f172a" stroke="#334155"/><text x="104" y="475" fill="#8b5cf6" font-size="15">DOCKER / TESTS</text><rect x="560" y="210" width="480" height="310" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="588" y="252" fill="#67e8f9" font-size="18">02 / PROBLEM</text><text x="588" y="296" fill="#f8fafc" font-size="30" font-weight="700">Career advice needs evidence</text><text x="588" y="334" fill="#cbd5e1" font-size="18">Generic chatbots can produce confident but unverifiable answers.</text><text x="588" y="368" fill="#94a3b8" font-size="17">CareerSage grounds responses in retrieved documents and citations.</text><rect x="588" y="404" width="424" height="82" rx="12" fill="#111827"/><text x="612" y="438" fill="#f8fafc" font-size="17">Traditional chatbot → uncertain source</text><text x="612" y="466" fill="#67e8f9" font-size="17">CareerSage → retrieved context + citation</text><rect x="1060" y="210" width="480" height="310" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="1088" y="252" fill="#67e8f9" font-size="18">03 / SOLUTION</text><text x="1088" y="296" fill="#f8fafc" font-size="30" font-weight="700">Retrieve first, then answer</text><text x="1088" y="334" fill="#cbd5e1" font-size="18">Normalize the query, apply scope control, retrieve relevant context, and explain the answer.</text><text x="1088" y="380" fill="#67e8f9" font-size="18">Question → Normalize → Guard → Retrieve → Cite</text><rect x="1088" y="416" width="424" height="70" rx="12" fill="#111827"/><text x="1112" y="446" fill="#f8fafc" font-size="17">BM25 retrieval + intent boosting</text><text x="1112" y="472" fill="#94a3b8" font-size="16">Optional LLM or extractive fallback</text><rect x="60" y="540" width="480" height="310" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="88" y="582" fill="#67e8f9" font-size="18">04 / CAPABILITIES</text><text x="88" y="626" fill="#f8fafc" font-size="30" font-weight="700">What it delivers</text><text x="88" y="664" fill="#cbd5e1" font-size="18">• Career Q&A with inline citations</text><text x="88" y="692" fill="#cbd5e1" font-size="18">• Resume skill-gap analysis</text><text x="88" y="720" fill="#cbd5e1" font-size="18">• Role recommendations</text><text x="88" y="748" fill="#cbd5e1" font-size="18">• Out-of-scope refusal</text><text x="88" y="776" fill="#cbd5e1" font-size="18">• Alias and typo tolerance</text><rect x="560" y="540" width="480" height="310" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="588" y="582" fill="#67e8f9" font-size="18">05 / ARCHITECTURE</text><text x="588" y="626" fill="#f8fafc" font-size="30" font-weight="700">System flow</text><rect x="588" y="656" width="424" height="46" rx="10" fill="#111827"/><text x="612" y="685" fill="#f8fafc" font-size="17">Validation + rate limiting</text><rect x="588" y="714" width="424" height="46" rx="10" fill="#111827"/><text x="612" y="743" fill="#f8fafc" font-size="17">Normalization + scope guard</text><rect x="588" y="772" width="424" height="46" rx="10" fill="#111827"/><text x="612" y="801" fill="#67e8f9" font-size="17">Retrieval → cited answer</text><rect x="1060" y="540" width="480" height="310" rx="18" fill="#0b1220" stroke="#1e293b"/><text x="1088" y="582" fill="#67e8f9" font-size="18">06 / RUN + ROADMAP</text><text x="1088" y="626" fill="#f8fafc" font-size="30" font-weight="700">Run, validate, extend</text><rect x="1088" y="656" width="424" height="52" rx="10" fill="#111827"/><text x="1112" y="688" fill="#67e8f9" font-size="16">python -m app.server</text><rect x="1088" y="720" width="424" height="52" rx="10" fill="#111827"/><text x="1112" y="752" fill="#67e8f9" font-size="16">python -m unittest discover -v</text><text x="1088" y="806" fill="#94a3b8" font-size="16">Roadmap: hybrid retrieval, reranking, PDF parsing</text></g><rect x="60" y="866" width="1480" height="4" rx="2" fill="url(#accent)"/></svg>